name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: dev-gcc
          - os: ubuntu-24.04
            preset: asan
          - os: windows-2022
            preset: dev-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache instances
        uses: actions/cache@v4
        with:
          path: data
          key: tsplib-instances-v3

      - name: Fetch instances
        shell: bash
        run: bash engine/tools/fetch_instances.sh

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        working-directory: engine
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: engine
        shell: bash
        # On failure, surface compiler errors as annotations (readable without log access).
        run: |
          set -o pipefail
          if ! cmake --build --preset ${{ matrix.preset }} 2>&1 | tee build.log; then
            grep -E "error|Error|warning C" build.log | head -20 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi

      - name: Test
        working-directory: engine
        run: ctest --preset ${{ matrix.preset }}
